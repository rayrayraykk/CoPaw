[workspace]
members = [
    "crates/qwenpaw-app-server",
    "crates/qwenpaw-app-server-client",
    "crates/qwenpaw-cli",
    "crates/qwenpaw-core",
    "crates/qwenpaw-mcp",
    "crates/qwenpaw-protocol",
    "crates/qwenpaw-storage",
    "crates/qwenpaw-tools",
]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/rayrayraykk/CoPaw"

[workspace.dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["multipart", "ws"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
base64 = "0.22"
bytes = "1.10"
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
futures-util = "0.3"
http = "1.3"
keyring = "4.2"
mime_guess = "2.0"
notify = "8.2"
pretty_assertions = "1.4"
rand = "0.9"
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
reqwest = { version = "0.13.2", default-features = false, features = [
    "form",
    "http2",
    "json",
    "multipart",
    "rustls",
    "stream",
] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rmcp = { version = "=3.1.3", default-features = false, features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }
schemars = "0.8.22"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tempfile = "3.23"
tokio = { version = "1.47", features = [
    "fs",
    "io-std",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "sync",
    "time",
] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ts-rs = "11.0.1"
uuid = { version = "1.18", features = ["v7"] }
url = "2.5"
zip = { version = "8.1.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
