name: VS Code Extension

on:
  push:
    branches: [main]
    paths:
      - "qwenpaw-core/**"
      - "extensions/vscode/**"
      - ".github/workflows/vscode-extension.yml"
  pull_request:
    paths:
      - "qwenpaw-core/**"
      - "extensions/vscode/**"
      - ".github/workflows/vscode-extension.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: qwenpaw-core -> target
      - run: cargo build --locked -p qwenpaw-cli
        working-directory: qwenpaw-core
      - run: npm ci
      - run: npm run check
      - run: npm run package
