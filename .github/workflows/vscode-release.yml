name: VS Code Platform Packages

on:
  workflow_dispatch:
  push:
    tags:
      - "vscode-v*"

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: darwin-arm64
            executable: qwenpaw-core
          - os: macos-15-intel
            target: darwin-x64
            executable: qwenpaw-core
          - os: ubuntu-latest
            target: linux-x64
            executable: qwenpaw-core
          - os: windows-latest
            target: win32-x64
            executable: qwenpaw-core.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: extensions/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      - run: npm ci
      - name: Set up Rust for source QA
        if: github.event_name == 'workflow_dispatch'
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache for source QA
        if: github.event_name == 'workflow_dispatch'
        uses: Swatinem/rust-cache@v2
        with:
          key: vscode-${{ matrix.target }}
          workspaces: qwenpaw-core -> target
      - name: Build Core from source for QA
        if: github.event_name == 'workflow_dispatch'
        working-directory: qwenpaw-core
        run: cargo build --release --locked -p qwenpaw-cli
      - name: Download locked Core release
        if: github.event_name != 'workflow_dispatch'
        id: core
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          QWENPAW_VSCODE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          repository="$(node -p "require('./core-release.json').repository")"
          tag="$(node -p "require('./core-release.json').tag")"
          asset="$(node -p "require('./core-release.json').assets[process.env.QWENPAW_VSCODE_TARGET]")"
          download="$RUNNER_TEMP/qwenpaw-core-download"
          mkdir -p "$download"
          gh release download "$tag" --repo "$repository" --pattern "$asset" --dir "$download"
          tar -xzf "$download/$asset" -C "$download"
          binary="$download/${{ matrix.executable }}"
          if [[ ! -f "$binary" ]]; then
            echo "Core archive did not contain ${{ matrix.executable }}" >&2
            exit 1
          fi
          chmod +x "$binary"
          echo "binary=$binary" >> "$GITHUB_OUTPUT"
      - name: Build target VSIX from source for QA
        if: github.event_name == 'workflow_dispatch'
        env:
          QWENPAW_CORE_BIN: ${{ format('{0}/qwenpaw-core/target/release/{1}', github.workspace, matrix.executable) }}
          QWENPAW_VSCODE_TARGET: ${{ matrix.target }}
          QWENPAW_VSCODE_PACKAGE_KIND: qa
        run: npm run package:bundled
      - name: Build target VSIX from locked release
        if: github.event_name != 'workflow_dispatch'
        env:
          QWENPAW_CORE_BIN: ${{ steps.core.outputs.binary }}
          QWENPAW_VSCODE_TARGET: ${{ matrix.target }}
          QWENPAW_VSCODE_PACKAGE_KIND: release
        run: npm run package:bundled
      - name: Upload QA VSIX
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: qwenpaw-vscode-qa-${{ matrix.target }}
          path: extensions/vscode/*.vsix
          if-no-files-found: error
          retention-days: 3
      - name: Upload release VSIX
        if: github.event_name != 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: qwenpaw-vscode-${{ matrix.target }}
          path: extensions/vscode/*.vsix
          if-no-files-found: error
