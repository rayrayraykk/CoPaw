name: Core CI

on:
  push:
    branches: [main]
    paths:
      - "qwenpaw-core/**"
      - "console/src/**"
      - "console/scripts/generate-rust-api-inventory.mjs"
      - "console/package.json"
      - "console/package-lock.json"
      - ".github/workflows/rust-core-ci.yml"
  pull_request:
    paths:
      - "qwenpaw-core/**"
      - "console/src/**"
      - "console/scripts/generate-rust-api-inventory.mjs"
      - "console/package.json"
      - "console/package-lock.json"
      - ".github/workflows/rust-core-ci.yml"

permissions:
  contents: read

jobs:
  web-api-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
        working-directory: console
      - run: npm run verify:api-inventory
        working-directory: console

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: qwenpaw-core

  msrv:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qwenpaw-core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: qwenpaw-core -> target
      - run: cargo test --workspace --locked

  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qwenpaw-core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: qwenpaw-core -> target
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: qwenpaw-core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: qwenpaw-core -> target
      - run: cargo test --workspace

  sdk:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: qwenpaw-core
          - os: macos-latest
            binary: qwenpaw-core
          - os: windows-latest
            binary: qwenpaw-core.exe
    runs-on: ${{ matrix.os }}
    env:
      QWENPAW_CORE_BIN: ${{ format('{0}/qwenpaw-core/target/debug/{1}', github.workspace, matrix.binary) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: qwenpaw-core/sdk/typescript/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: qwenpaw-core -> target
      - run: cargo build --locked -p qwenpaw-cli
        working-directory: qwenpaw-core
      - run: npm ci
        working-directory: qwenpaw-core/sdk/typescript
      - run: npm run check
        working-directory: qwenpaw-core/sdk/typescript
      - run: python -m unittest discover -s tests -v
        working-directory: qwenpaw-core/sdk/python
        env:
          PYTHONPATH: src
