name: PR preview tests

on:
  workflow_dispatch:

jobs:
  windows-hub-runtime:
    name: Windows Hub Runtime
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[hub,dev,test,full]"

      - name: Verify real AppContainer runtime
        shell: bash
        env:
          QWENPAW_WINDOWS_APPCONTAINER_E2E: '1'
        run: |
          pytest \
            tests/unit/hub/test_windows_process_isolation.py::test_windows_appcontainer_real_preflight \
            tests/e2e/test_windows_hub_local_runtime.py \
            -v
